name: Release

on:
  push:
    tags: ["v*"]
  # Lets a release be rebuilt without moving a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Completions and the man page are the same bytes whatever the target, and
  # the cross-compiled one cannot run its own binary to produce them. So they
  # are generated once, here, and packaged into every archive.
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate
        run: |
          mkdir -p generated/completions
          cargo run --quiet --locked -- --man > generated/termmd.1
          # Named as clap_complete names them, which is what every shell's
          # completion directory expects to find.
          cargo run --quiet --locked -- --completions bash \
            > generated/completions/termmd.bash
          cargo run --quiet --locked -- --completions zsh \
            > generated/completions/_termmd
          cargo run --quiet --locked -- --completions fish \
            > generated/completions/termmd.fish
          cargo run --quiet --locked -- --completions powershell \
            > generated/completions/_termmd.ps1
          cargo run --quiet --locked -- --completions elvish \
            > generated/completions/termmd.elv
          # Empty output would package silently; a man page without a title
          # would not.
          grep -q '^\.TH termmd 1' generated/termmd.1
          grep -q '^#compdef termmd' generated/completions/_termmd

      - uses: actions/upload-artifact@v4
        with:
          name: manual
          path: generated
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: manual
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Cross-compiled from the arm64 runner rather than built on an Intel
          # one: GitHub's Intel macOS runners are on the way out, and the macOS
          # SDK targets both architectures from either host.
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: manual
          path: generated

      # A binary that cannot run is not worth shipping. Skipped for a
      # cross-compiled target, which the host cannot execute.
      - name: Smoke test
        if: matrix.os != 'windows-latest' && !matrix.cross
        run: |
          ./target/${{ matrix.target }}/release/termmd --version
          ./target/${{ matrix.target }}/release/termmd -P --width 60 README.md > /dev/null
          ./target/${{ matrix.target }}/release/termmd --man > /dev/null
          ./target/${{ matrix.target }}/release/termmd --completions zsh > /dev/null
        shell: bash

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          staging="termmd-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/termmd" "$staging/"
          cp README.md LICENSE CHANGELOG.md "$staging/"
          cp docs/config.example.toml "$staging/"
          cp generated/termmd.1 "$staging/"
          cp -r generated/completions "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
        shell: bash

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          $staging = "termmd-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/termmd.exe" $staging
          Copy-Item README.md, LICENSE, CHANGELOG.md $staging
          Copy-Item docs/config.example.toml $staging
          Copy-Item generated/termmd.1 $staging
          Copy-Item generated/completions $staging -Recurse
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Archives only: the generated man page and completions travel inside
      # them, and have no business being release assets of their own.
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Use the matching CHANGELOG section as the release notes when there
          # is one, so the notes are written by a person rather than generated.
          version="${TAG#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            gh release create "$TAG" artifacts/* --title "$TAG" --generate-notes
          else
            printf '%s\n' "$notes" > notes.md
            gh release create "$TAG" artifacts/* --title "$TAG" --notes-file notes.md
          fi
