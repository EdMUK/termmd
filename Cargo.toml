[package]
name = "termmd"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "A best-in-class Markdown viewer for the terminal: real typography, real tables, real images."
authors = ["termmd contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/EdMUK/termmd"
homepage = "https://github.com/EdMUK/termmd"
documentation = "https://docs.rs/termmd"
keywords = ["markdown", "terminal", "cli", "viewer", "ansi"]
categories = ["command-line-utilities", "text-processing"]
exclude = [".github/*"]

# `cargo binstall termmd` downloads the release archive instead of building.
# Pinned rather than left to binstall's defaults, none of which match how the
# release workflow names and lays out an archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "termmd"
path = "src/main.rs"

[lib]
name = "termmd"
path = "src/lib.rs"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
# `--completions` and `--man` generate from the same `Command` clap parses
# with, so what they describe cannot drift from what the program accepts.
clap_complete = "4.5"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
anyhow = "1"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
open = "5"
memchr = "2"
resvg = { version = "0.48", default-features = false, optional = true }


[features]
default = ["svg"]
# SVG rendering. Worth having on: most badges in a README are SVG.
svg = ["dep:resvg", "resvg/text", "resvg/system-fonts"]

[dev-dependencies]
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
